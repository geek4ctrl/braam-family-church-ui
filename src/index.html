<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BRAAM Family | A Fire Fellowship</title>
  <meta name="description" content="BRAAM Family is a fire fellowship in Johannesburg, South Africa. Believers with a renewed and awakened mindset, growing together in faith and purpose.">
  <meta name="theme-color" content="#08080d">
  <meta name="author" content="Laurent Mbuyi">
  <meta name="developer" content="Laurent Mbuyi">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="app-config.js"></script>
</head>
<body>
  <script>
    /*
     * Apply the saved theme before first paint. PreferencesService can only set
     * the class once Angular has downloaded and bootstrapped, which would make
     * every light-theme visit flash the dark theme first.
     */
    try {
      if (localStorage.getItem('braam-theme') === 'light') document.body.classList.add('light-theme');
    } catch (err) {
      /* storage unavailable (private mode) — stay on the default dark theme */
    }
  </script>
  <app-root></app-root>
</body>
</html>
